<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d35">
  <title>最小生成樹 MST｜互動步驟</title>
  <style>
    :root { color-scheme: light; --ink:#18332e; --muted:#718078; --paper:#f3f5f1; --line:#dce4de; --green:#1d5949; --green-soft:#e5f1e9; --gold:#d6a438; --red:#b74f43; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    button, select { font:inherit; }
    .top { height:62px; color:white; background:#173d35; border-bottom:4px solid #f2cf72; }
    .top-inner, main { width:min(1140px,calc(100% - 32px)); margin:auto; }
    .top-inner { height:100%; display:flex; align-items:center; justify-content:space-between; font-weight:800; }
    .top a { color:#e8f1eb; text-decoration:none; font-size:14px; font-weight:500; }
    main { padding:28px 0 48px; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(26px,4vw,36px); line-height:1.25; }
    .subtitle { margin:5px 0 0; color:var(--muted); font-size:14px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .tabs { display:flex; gap:3px; padding:4px; border-radius:10px; background:#e6ece7; }
    .tabs button, .button { border:0; border-radius:7px; padding:9px 14px; cursor:pointer; font-weight:750; }
    .tabs button { color:#596b61; background:transparent; }
    .tabs button.active { color:var(--green); background:#fff; box-shadow:0 2px 8px #173d3518; }
    .start { display:none; align-items:center; gap:5px; padding:0 9px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:white; font-size:13px; }
    .start.visible { display:flex; }
    .start select { padding:8px 3px; border:0; outline:0; color:var(--green); background:transparent; font-weight:800; cursor:pointer; }
    .button.next { color:#fff; background:var(--green); }
    .button.next:hover { background:#124435; }
    .button.reset { color:var(--green); background:var(--green-soft); }
    .layout { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(285px,.85fr); gap:16px; }
    .panel { border:1px solid var(--line); border-radius:15px; background:#fff; box-shadow:0 14px 38px #193c3010; }
    .graph-panel { overflow:hidden; }
    .graph-title { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px 0; font-size:14px; font-weight:800; }
    .muted { color:var(--muted); font-size:12px; font-weight:500; }
    .graph-wrap { padding:4px 10px 0; }
    svg { display:block; width:100%; height:auto; }
    .edge-line { stroke:#cfdbd3; stroke-width:5; stroke-linecap:round; transition:stroke .2s,stroke-width .2s; }
    .edge-line.accepted { stroke:var(--green); stroke-width:7; }
    .edge-line.skipped { stroke:#bac3bd; stroke-width:4; stroke-dasharray:8 7; }
    .edge-line.current { stroke:var(--gold); stroke-width:9; }
    .edge-label rect { fill:white; stroke:#e2e8e3; }
    .edge-label text { fill:#354b41; font-size:14px; font-weight:800; text-anchor:middle; dominant-baseline:central; }
    .edge-label.accepted rect { fill:var(--green-soft); stroke:#b6d5be; }
    .edge-label.skipped rect { fill:#f0f2f0; stroke:#cbd1cd; }
    .edge-label.current rect { fill:#fff3d8; stroke:#e4c87c; }
    .node circle { fill:white; stroke:#8ba59a; stroke-width:3; }
    .node.tree circle { fill:var(--green); stroke:var(--green); }
    .node text { fill:var(--ink); font-size:16px; font-weight:850; text-anchor:middle; dominant-baseline:central; }
    .node.tree text { fill:white; }
    .legend { display:flex; flex-wrap:wrap; gap:14px; padding:0 18px 17px; color:var(--muted); font-size:12px; }
    .legend span { display:flex; align-items:center; gap:6px; }
    .swatch { width:10px; height:10px; border-radius:50%; background:var(--green); }
    .swatch.gold { background:var(--gold); }
    .swatch.gray { background:#bac3bd; }
    .side { display:flex; flex-direction:column; gap:14px; }
    .progress { padding:18px; }
    .stepbar { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:13px; font-weight:750; }
    .count { padding:3px 9px; border-radius:99px; color:var(--green); background:var(--green-soft); font-size:12px; }
    .message { min-height:52px; margin:13px 0 12px; font-size:17px; font-weight:800; line-height:1.5; }
    .detail { min-height:51px; padding:10px 11px; border-radius:9px; color:#52645b; background:#f2f5f2; font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
    .detail.success { color:#18563d; background:var(--green-soft); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px; }
    .stat { padding:10px 11px; border:1px solid #e7ece8; border-radius:9px; }
    .stat small { display:block; color:var(--muted); font-size:12px; }
    .stat strong { display:block; margin-top:2px; font-size:21px; }
    .node-list { display:flex; flex-wrap:wrap; gap:6px; min-height:25px; margin-top:8px; }
    .chip { padding:2px 9px; border:1px solid #c5ddcc; border-radius:99px; color:var(--green); background:var(--green-soft); font-size:12px; font-weight:800; }
    .history-panel { flex:1; padding:15px 18px; }
    .history-panel h2 { margin:0 0 9px; font-size:14px; }
    .history { display:grid; gap:5px; margin:0; padding:0; list-style:none; }
    .history li { display:flex; justify-content:space-between; gap:10px; padding-bottom:5px; border-bottom:1px solid #edf0ed; font-size:13px; }
    .history li:last-child { border:0; }
    .yes { color:var(--green); font-weight:750; }
    .no { color:#858d88; }
    @media(max-width:800px) { .heading { align-items:flex-start; flex-direction:column; } .layout { grid-template-columns:1fr; } .side { display:grid; grid-template-columns:1fr 1fr; } .progress { grid-row:span 2; } }
    @media(max-width:560px) { .top-inner,main { width:calc(100% - 22px); } main { padding-top:20px; } .controls { width:100%; } .tabs { flex:1; } .tabs button { flex:1; } .start { flex:1; justify-content:center; } .side { display:flex; } .graph-title { align-items:flex-start; flex-direction:column; } .graph-wrap { padding-inline:2px; } }
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><span>演算法互動練習</span><a href="./index.html">回首頁</a></div></header>
  <main>
    <div class="heading">
      <div><h1>最小生成樹 MST</h1><p class="subtitle">選擇演算法，按「下一步」觀看每一步的變化。</p></div>
      <div class="controls">
        <div class="tabs" role="group" aria-label="選擇演算法"><button id="kruskalTab" class="active" type="button">Kruskal</button><button id="primTab" type="button">Prim</button></div>
        <label id="startPicker" class="start" for="startVertex">起點
          <select id="startVertex" aria-label="Prim 起始頂點"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option><option value="4">E</option><option value="5">F</option></select>
        </label>
        <button id="nextButton" class="button next" type="button">下一步</button>
        <button id="resetButton" class="button reset" type="button">重來</button>
      </div>
    </div>
    <div class="layout">
      <section class="panel graph-panel" aria-label="MST 演算法圖示">
        <div class="graph-title"><strong id="graphTitle">Kruskal</strong><span class="muted">頂點 A～F · 點線表示邊，數字表示權重</span></div>
        <div class="graph-wrap"><svg id="graph" viewBox="0 0 760 370" role="img" aria-label="頂點 A 到 F 的加權無向圖"></svg></div>
        <div class="legend"><span><i class="swatch"></i>已加入生成樹</span><span><i class="swatch gold"></i>本步處理</span><span><i class="swatch gray"></i>因成環跳過</span></div>
      </section>
      <aside class="side">
        <section class="panel progress">
          <div class="stepbar"><span id="stepLabel">Kruskal 步驟</span><span id="stepCount" class="count">0 / 6</span></div>
          <div id="message" class="message" aria-live="polite">按「下一步」開始。</div>
          <div id="detail" class="detail" aria-live="polite">尚未開始</div>
          <div class="stats"><div class="stat"><small>已選邊數</small><strong id="edgeCount">0 / 5</strong></div><div class="stat"><small>目前總重</small><strong id="weight">0</strong></div></div>
          <small style="display:block;margin-top:13px;color:var(--muted)">目前樹中的頂點</small>
          <div id="nodes" class="node-list"></div>
        </section>
        <section class="panel history-panel"><h2>步驟紀錄</h2><ol id="history" class="history"><li class="muted">按下一步開始</li></ol></section>
      </aside>
    </div>
  </main>
  <script>
    const names = ["A", "B", "C", "D", "E", "F"];
    const points = [[82,185],[255,72],[255,298],[492,72],[492,298],[678,185]];
    const edges = [
      {id:"AB",a:0,b:1,w:4},{id:"AC",a:0,b:2,w:2},{id:"BC",a:1,b:2,w:1},
      {id:"BD",a:1,b:3,w:5},{id:"CD",a:2,b:3,w:8},{id:"CE",a:2,b:4,w:10},
      {id:"DE",a:3,b:4,w:2},{id:"DF",a:3,b:5,w:6},{id:"EF",a:4,b:5,w:3}
    ];
    const byId = Object.fromEntries(edges.map(e => [e.id,e]));
    const sorted = [...edges].sort((x,y) => x.w-y.w || x.a-y.a || x.b-y.b);
    let mode = "kruskal", start = 0, trace = [], step = 0;
    const graph = document.getElementById("graph");

    function label(e) { return `${names[e.a]}-${names[e.b]} (${e.w})`; }
    function makeKruskal() {
      const parent = names.map((_,i) => i), events = [];
      const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
      let chosen = 0, total = 0;
      for (const e of sorted) {
        const ra = find(e.a), rb = find(e.b);
        if (ra === rb) {
          events.push({edge:e.id, accepted:false, total, parent:[...parent], detail:`find(${names[e.a]}) = ${ra}，find(${names[e.b]}) = ${rb}；兩端同根，跳過以免成環。`});
        } else {
          const low = Math.min(ra,rb), high = Math.max(ra,rb);
          parent[high] = low;
          chosen++; total += e.w;
          events.push({edge:e.id, accepted:true, total, parent:[...parent], detail:`合併集合，較小的根 ${names[low]} 當老大。p[] = [${parent.join(", ")}]`});
          if (chosen === names.length-1) break;
        }
      }
      return events;
    }
    function makePrim() {
      const inside = new Set([start]), queue = [], events = [];
      let total = 0;
      const addEdges = from => edges.forEach(e => {
        if (e.a === from && !inside.has(e.b)) queue.push({id:e.id,w:e.w,v:e.b,from:e.a});
        else if (e.b === from && !inside.has(e.a)) queue.push({id:e.id,w:e.w,v:e.a,from:e.b});
      });
      addEdges(start);
      while (inside.size < names.length) {
        queue.sort((x,y) => x.w-y.w || x.v-y.v || x.from-y.from);
        let ticket;
        do { ticket = queue.shift(); } while (ticket && inside.has(ticket.v));
        if (!ticket) break;
        inside.add(ticket.v); total += ticket.w;
        const e = byId[ticket.id];
        events.push({edge:e.id,accepted:true,total,nodes:[...inside].sort((a,b)=>a-b),detail:`加入 ${label(e)}；樹中頂點：${[...inside].sort((a,b)=>a-b).map(i=>names[i]).join("、")}。`});
        addEdges(ticket.v);
      }
      return events;
    }
    function rebuild() { trace = mode === "kruskal" ? makeKruskal() : makePrim(); step = 0; render(); }
    function visibleEvents() { return trace.slice(0,step); }
    function currentSets() {
      if (mode === "prim") return new Set(step ? trace[step-1].nodes : [start]);
      const set = new Set();
      for (const event of visibleEvents()) if (event.accepted) { set.add(byId[event.edge].a); set.add(byId[event.edge].b); }
      return set;
    }
    function renderGraph() {
      const shown = visibleEvents(), last = shown[shown.length-1];
      const accepted = new Set(shown.filter(e=>e.accepted).map(e=>e.edge));
      const skipped = new Set(shown.filter(e=>!e.accepted).map(e=>e.edge));
      const current = last?.edge;
      const lines = edges.map(e => {
        const [x1,y1]=points[e.a], [x2,y2]=points[e.b], mx=(x1+x2)/2, my=(y1+y2)/2;
        const state = accepted.has(e.id) ? "accepted" : skipped.has(e.id) ? "skipped" : "";
        const focus = current === e.id ? "current" : "";
        return `<g><line class="edge-line ${state} ${focus}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><g class="edge-label ${state} ${focus}" transform="translate(${mx},${my})"><rect x="-17" y="-13" width="34" height="26" rx="9"/><text y="1">${e.w}</text></g></g>`;
      }).join("");
      const tree = currentSets();
      const nodes = points.map(([x,y],i)=>`<g class="node ${tree.has(i)?"tree":""}"><circle cx="${x}" cy="${y}" r="25"/><text x="${x}" y="${y+1}">${names[i]}</text></g>`).join("");
      graph.innerHTML = lines + nodes;
    }
    function render() {
      const shown = visibleEvents(), last = shown[shown.length-1], done = step === trace.length;
      document.getElementById("kruskalTab").classList.toggle("active",mode === "kruskal");
      document.getElementById("primTab").classList.toggle("active",mode === "prim");
      document.getElementById("startPicker").classList.toggle("visible",mode === "prim");
      document.getElementById("graphTitle").textContent = mode === "kruskal" ? "Kruskal · 依權重檢查" : `Prim · 從 ${names[start]} 開始`;
      document.getElementById("stepLabel").textContent = `${mode === "kruskal" ? "Kruskal" : "Prim"} 步驟`;
      document.getElementById("stepCount").textContent = `${step} / ${trace.length}`;
      document.getElementById("message").textContent = done ? `完成！最小生成樹總重為 ${last?.total ?? 0}。` : !last ? "按「下一步」開始。" : `${label(byId[last.edge])}：${last.accepted ? "加入生成樹" : "形成環，跳過"}`;
      document.getElementById("detail").textContent = last ? last.detail : (mode === "prim" ? `起點 ${names[start]} 已在樹中，尚未選邊。` : "邊會依權重由小到大處理。" );
      document.getElementById("detail").classList.toggle("success",!!last?.accepted);
      const total = last?.total ?? 0;
      const picked = shown.filter(e=>e.accepted).length;
      document.getElementById("edgeCount").textContent = `${picked} / 5`;
      document.getElementById("weight").textContent = total;
      document.getElementById("nodes").innerHTML = [...currentSets()].sort((a,b)=>a-b).map(i=>`<span class="chip">${names[i]}</span>`).join("");
      document.getElementById("history").innerHTML = shown.map(e=>`<li><span>${label(byId[e.edge])}</span><span class="${e.accepted?"yes":"no"}">${e.accepted?"加入":"成環跳過"}</span></li>`).join("") || `<li class="muted">按下一步開始</li>`;
      document.getElementById("nextButton").disabled = done;
      document.getElementById("nextButton").textContent = done ? "已完成" : "下一步";
      renderGraph();
    }
    document.getElementById("kruskalTab").addEventListener("click",()=>{mode="kruskal";rebuild();});
    document.getElementById("primTab").addEventListener("click",()=>{mode="prim";rebuild();});
    document.getElementById("startVertex").addEventListener("change",event=>{start=Number(event.target.value);rebuild();});
    document.getElementById("nextButton").addEventListener("click",()=>{if(step<trace.length){step++;render();}});
    document.getElementById("resetButton").addEventListener("click",()=>{step=0;render();});
    rebuild();
  </script>
</body>
</html>
